name: Release

# A version tag builds the site and the desktop widget for Windows and macOS,
# then publishes them together on one GitHub release. Running it by hand builds
# everything too, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes of the same tag must not race to create one release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The static site: the same bundle Cloudflare serves, zipped for anyone
  # who wants to host it themselves.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Zip the site
        run: |
          cd dist
          zip -qr ../world-clock-web.zip .
          cd ..
          ls -lh world-clock-web.zip

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: world-clock-web.zip
          if-no-files-found: error

  # The desktop widget. macOS is built for both Apple silicon and Intel in
  # one universal binary. Each leg signs its own update package and uploads it
  # to the tag's release, so `latest.json` ends up listing every platform; the
  # action's release lookup is retried, so two legs creating it at once is
  # harmless.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: windows
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            label: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A tag publishes here. The signing key is what lets a running widget
      # verify and install the update; without it the app still builds, but no
      # updater files (or `latest.json`) are made. A hand run passes no tagName,
      # so it only builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('World Clock {0}', github.ref_name) || '' }}
          releaseBody: |
            The world clock for the web and the desktop.

            - **Web**: `world-clock-web.zip` — the static site; unzip it at the root of any static host.
            - **Windows**: `.msi` or the `.exe` setup — the first launch installs the WebView2 runtime if the machine lacks it.
            - **macOS**: `.dmg`, universal (Apple silicon and Intel) — the build is unsigned, so on first open use right-click → Open, or allow it in System Settings → Privacy & Security.

            Installed desktop copies update themselves: they offer this release shortly after launch, and one click installs it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The action's own globbing, so this works the same on Windows and macOS
      # and finds the universal build's bundles under its own target dir.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          # The installers plus the updater's own files: the .sig signatures
          # and the packages a running app downloads to update itself.
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.nsis.zip
            src-tauri/target/**/release/bundle/**/*.msi.zip
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

  # The site goes on the release the desktop legs made, once both have
  # finished, so a failed build leaves no release advertising a site alone.
  publish:
    needs: [web, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: assets

      - name: Attach the site to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/world-clock-web.zip --clobber --repo "$GITHUB_REPOSITORY"
